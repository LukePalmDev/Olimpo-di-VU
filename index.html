<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Olimpo di VU</title>
  <meta name="description" content="Galleria dell'Olimpo di VU: ritratti dei membri e la divinità greca associata a ciascuno." />
  <meta property="og:title" content="Olimpo di VU" />
  <meta property="og:description" content="Galleria dell'Olimpo di VU: ritratti dei membri e la divinità greca associata a ciascuno." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://olimpo.byluke.org/" />
  <meta property="og:site_name" content="Olimpo di VU" />
  <meta property="og:locale" content="it_IT" />
  <meta property="og:image" content="https://olimpo.byluke.org/Images/1.webp" />
  <meta property="og:image:alt" content="Ritratto di Salvatore nei panni di Crono" />
  <meta property="og:image:type" content="image/webp" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' fill='white' font-family='system-ui'%3EO%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e6e6e6;
      --muted: #9aa0a6;
      --accent: #7c3aed;
      --card: #171923;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 50% -10%, #1b1f2a 0%, var(--bg) 60%);
      background-color: var(--bg); /* anti white flash */
      color: var(--fg);
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      min-height: 100svh; /* mobile viewport robust */
      overflow-x: hidden;
      display: grid;
      place-items: safe center; /* se il contenuto è più alto, resta scrollabile dall'alto */
    }

    .wrap {
      width: min(100%, 680px);
      display: grid;
      justify-items: center;
    }

    .pageTitle {
      margin: 0 0 10px;
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;
      letter-spacing: .2px;
      text-align: center;
      line-height: 1.2;
    }

    .stage {
      position: relative;
      width: max-content;
      max-width: 100%;
      background: var(--card);
      border-radius: 24px;
      padding: 18px 18px 8px; /* più spazio per meta */
      box-shadow: var(--shadow);
    }

    .frame {
      position: relative;
      container-type: inline-size;
      /* resta nel viewport: quadrato meno spazio per nome, dio, puntini e padding */
      width: min(calc(100vw - 72px), 600px, max(180px, calc(100svh - 248px)));
      aspect-ratio: 1 / 1; /* foto quadrata */
      border-radius: 16px;
      overflow: hidden;
      background: #0b0d12;
      margin: 0 auto;
    }
    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform .35s ease;
    }
    .frame.loading img { opacity: .6; filter: blur(2px); }

    .navBtn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px; height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(10,12,18,.55);
      backdrop-filter: blur(6px);
      display: grid; place-items: center;
      cursor: pointer;
      transition: background .2s ease, transform .08s ease;
    }
    @media (hover: hover) {
      .navBtn:hover { background: rgba(10,12,18,.75); }
    }
    .navBtn:active { transform: translateY(-50%) scale(.97); }
    .navBtn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }
    .navLeft { left: 14px; }
    .navRight { right: 14px; }
    @container (max-width: 240px) {
      .navBtn { width: 40px; height: 40px; }
      .navLeft { left: 8px; }
      .navRight { right: 8px; }
    }
    .navBtn svg { width: 22px; height: 22px; fill: currentColor; color: #fff; }

    .dots {
      margin-top: 10px;
      min-height: 8px;
      display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 999px; opacity: .35; background: #fff; transition: opacity .2s ease;
    }
    .dot.active { opacity: 1; }

    .meta {
      display: grid; gap: 8px; padding: 10px 8px 12px;
      text-align: center;
      min-height: 90px; /* più spazio per nome + dio */
    }
    .name { font-weight: 800; font-size: clamp(18px, 2.6vw, 24px); letter-spacing: .2px; }
    .deity { color: var(--muted); font-size: clamp(15px, 2.2vw, 18px); }

    a { color: var(--fg); }

    @media (prefers-reduced-motion: reduce) {
      .frame img { transition: none; }
    }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      .wrap { width: 100%; }
      .stage { padding: 14px 14px 10px; }
      .frame { width: min(calc(100vw - 60px), max(180px, calc(100svh - 248px))); }
      .meta { gap: 10px; min-height: 104px; }
      .name { font-size: 22px; }
      .deity { font-size: 18px; }
    }
  </style>
</head>
<body>
  <section class="wrap" aria-label="Galleria di foto con scorrimento in loop">
    <h1 class="pageTitle">Olimpo di VU</h1>
    <div class="stage">
      <div class="frame" id="frame">
        <img id="photo" src="Images/1.webp" alt="Ritratto di Salvatore nei panni di Crono" width="1024" height="1024" decoding="async" loading="eager" fetchpriority="high" />
        <button type="button" class="navBtn navLeft" id="prevBtn" aria-label="Foto precedente">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button type="button" class="navBtn navRight" id="nextBtn" aria-label="Foto successiva">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </button>
      </div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="meta" aria-live="polite">
        <div class="name" id="name">Salvatore</div>
        <div class="deity" id="deity">Crono</div>
      </div>
    </div>
  </section>

  <script id="gallery-data" type="application/json">
  {
    "items": [
      { "src": "Images/1.webp",  "name": "Salvatore",  "deity": "Crono",      "alt": "Ritratto di Salvatore nei panni di Crono",    "width": 1024, "height": 1024 },
      { "src": "Images/2.webp",  "name": "Roberto",    "deity": "Zeus",       "alt": "Ritratto di Roberto nei panni di Zeus",       "width": 1024, "height": 1024 },
      { "src": "Images/3.webp",  "name": "Fabio",      "deity": "Poseidone",  "alt": "Ritratto di Fabio nei panni di Poseidone",     "width": 1024, "height": 1024 },
      { "src": "Images/4.webp",  "name": "Francesco",  "deity": "Ares",       "alt": "Ritratto di Francesco nei panni di Ares",      "width": 1024, "height": 1024 },
      { "src": "Images/5.webp",  "name": "Andrea",     "deity": "Efesto",     "alt": "Ritratto di Andrea nei panni di Efesto",       "width": 1024, "height": 1024 },
      { "src": "Images/6.webp",  "name": "Carmen",     "deity": "Era",        "alt": "Ritratto di Carmen nei panni di Era",          "width": 1024, "height": 1024 },
      { "src": "Images/7.webp",  "name": "Salvatore",  "deity": "Ade",        "alt": "Ritratto di Salvatore nei panni di Ade",       "width": 1024, "height": 1024 },
      { "src": "Images/8.webp",  "name": "Fabiana",    "deity": "Atena",      "alt": "Ritratto di Fabiana nei panni di Atena",       "width": 1024, "height": 1024 },
      { "src": "Images/9.webp",  "name": "Martina",    "deity": "Demetra",    "alt": "Ritratto di Martina nei panni di Demetra",     "width": 1024, "height": 1024 },
      { "src": "Images/10.webp", "name": "Rosaria",    "deity": "Afrodite",   "alt": "Ritratto di Rosaria nei panni di Afrodite",    "width": 1024, "height": 1024 },
      { "src": "Images/11.webp", "name": "Assia",      "deity": "Artemide",   "alt": "Ritratto di Assia nei panni di Artemide",      "width": 1024, "height": 1024 },
      { "src": "Images/12.webp", "name": "Daniele",    "deity": "Ermes",      "alt": "Ritratto di Daniele nei panni di Ermes",       "width": 1024, "height": 1024 }
    ]
  }
  </script>

  <script>
    (function(){
      function readData(){
        const el = document.getElementById('gallery-data');
        try { return JSON.parse(el.textContent).items || []; }
        catch(e){ console.error('JSON non valido', e); return []; }
      }

      const items = readData();
      if (!Array.isArray(items) || items.length === 0) {
        alert('Nessun elemento nella galleria. Inserisci le foto nel JSON.');
        return;
      }

      const total = items.length;
      let index = 0;

      const frame  = document.getElementById('frame');
      const img    = document.getElementById('photo');
      const nameEl = document.getElementById('name');
      const deityEl= document.getElementById('deity');
      const dotsEl = document.getElementById('dots');

      const dots = [];
      for (let i=0;i<total;i++){
        const d = document.createElement('div');
        d.className = 'dot' + (i===0?' active':'');
        dotsEl.appendChild(d);
        dots.push(d);
      }

      const warm = [];
      function preload(item){
        if (!item || !item.src) return;
        if (warm.some((im) => im.src.endsWith(item.src))) return;
        const im = new Image();
        im.decoding = 'async';
        if (item.alt) im.alt = item.alt;
        if (item.width) im.width = item.width;
        if (item.height) im.height = item.height;
        if ('fetchPriority' in im) im.fetchPriority = 'low';
        im.src = item.src;
        warm.push(im);
        if (warm.length > 4) warm.shift();
      }

      let shownSrc = img.getAttribute('src') || '';
      let requestId = 0;

      function applyItem(item){
        img.alt = item.alt || ((item.name ? item.name + ' – ' : '') + (item.deity || ''));
        img.decoding = 'async';
        // The visible slide stays above the fold, so it is not lazy-loaded.
        img.loading = 'eager';
        if ('fetchPriority' in img) img.fetchPriority = index === 0 ? 'high' : 'auto';
        if (item.width) img.width = item.width;
        if (item.height) img.height = item.height;
        nameEl.textContent = item.name || '';
        deityEl.textContent = item.deity || '';
        dots.forEach((d,i)=> d.classList.toggle('active', i===index));
      }

      function preloadNeighbors(){
        preload(items[(index + 1) % total]);
        preload(items[(index - 1 + total) % total]);
      }

      function render(newIndex){
        index = (newIndex % total + total) % total;
        const item = items[index];
        const myRequest = ++requestId;

        const reveal = () => {
          if (myRequest !== requestId) return;
          applyItem(item);
          frame.classList.remove('loading');
          preloadNeighbors();
        };
        const fail = () => {
          if (myRequest !== requestId) return;
          img.removeAttribute('src');
          shownSrc = '';
          img.alt = 'Immagine non disponibile' + (item.name ? ' per ' + item.name : '');
          nameEl.textContent = item.name || '';
          deityEl.textContent = item.deity || '';
          dots.forEach((d,i)=> d.classList.toggle('active', i===index));
          frame.classList.remove('loading');
        };

        if (shownSrc === item.src) {
          if (img.complete && img.naturalWidth > 0) reveal();
          else if (img.complete) fail();
          else {
            img.addEventListener('load', reveal, {once:true});
            img.addEventListener('error', fail, {once:true});
          }
          return;
        }

        frame.classList.add('loading');
        const nextImg = new Image();
        nextImg.decoding = 'async';
        nextImg.onload = () => {
          if (myRequest !== requestId) return;
          img.src = item.src;
          shownSrc = item.src;
          reveal();
        };
        nextImg.onerror = fail;
        nextImg.src = item.src;
      }

      function next(){ render(index + 1); }
      function prev(){ render(index - 1); }

      document.getElementById('nextBtn').addEventListener('click', next);
      document.getElementById('prevBtn').addEventListener('click', prev);

      window.addEventListener('keydown', (e)=>{
        if (e.key === 'ArrowRight') next();
        else if (e.key === 'ArrowLeft') prev();
      });

      let startX = null, startY = null, moved = false;
      const swipeZone = frame;
      swipeZone.addEventListener('touchstart', e=>{
        const t = e.touches[0];
        startX = t.clientX; startY = t.clientY; moved = false;
      }, {passive:true});
      swipeZone.addEventListener('touchmove', e=>{ moved = true; }, {passive:true});
      swipeZone.addEventListener('touchend', e=>{
        if (startX===null || !moved) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - startX; const dy = Math.abs(t.clientY - startY);
        if (Math.abs(dx) > 30 && dy < 80) {
          if (dx < 0) next(); else prev();
        }
        startX = startY = null; moved = false;
      });

      let lastIndex = 0;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const animate = (toRight)=>{
        if (reduceMotion) return;
        img.style.transform = `scale(1.02) translateX(${toRight?'-12px':'12px'})`;
        requestAnimationFrame(()=>{
          setTimeout(()=>{ img.style.transform = 'none'; }, 220);
        });
      };
      const originalRender = render;
      let hasRendered = false;
      render = function(newIndex){
        const toRight = newIndex > lastIndex || (newIndex===0 && lastIndex===total-1);
        lastIndex = (newIndex % total + total) % total;
        if (hasRendered) animate(toRight);
        hasRendered = true;
        originalRender(newIndex);
      };

      // Render immediato (centra l'interfaccia anche prima del load effettivo)
      render(0);
    })();
  </script>
</body>
</html>
